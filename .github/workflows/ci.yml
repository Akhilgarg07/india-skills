name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pytest
        run: python -m pip install --upgrade pip pytest
      - name: Lint skills (Agent Skills spec + repo rules)
        run: python tools/check_skills.py --todos
      - name: Run tests
        run: python -m pytest -q
